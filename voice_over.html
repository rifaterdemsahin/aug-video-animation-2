<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voiceover Teleprompter — August Video Animation #2</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .prompter-box {
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .prompter-text {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.4;
      max-width: 900px;
      color: #fff;
      transition: all 0.2s ease;
    }
    .recording-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
    }
    .recording-item.active {
      border-color: var(--accent-green);
      background: var(--bg-surface-elevated);
    }
  </style>
</head>
<body>
  <header class="app-header"></header>

  <main class="app-container">
    <div class="view-header">
      <div class="view-title-group">
        <h1>🎙️ Voiceover Teleprompter & Recording Studio</h1>
        <p>Live spoken cadence meter, sentence-by-sentence take checklist, and automated audio playback.</p>
      </div>
      <div class="header-actions">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span style="font-size: 0.85rem; color: var(--text-secondary);">Prompter Font:</span>
          <button class="btn btn-sm btn-icon" id="btn-font-smaller">A-</button>
          <button class="btn btn-sm btn-icon" id="btn-font-larger">A+</button>
        </div>
      </div>
    </div>

    <!-- Active Prompter Screen -->
    <div class="prompter-box">
      <div style="position: absolute; top: 1rem; left: 1.5rem;" class="badge badge-purple" id="prompter-scene-tag">Scene 1 • Shot 1</div>
      <div style="position: absolute; top: 1rem; right: 1.5rem;" class="badge badge-green" id="prompter-wpm-tag">Target: 140 WPM</div>
      <div class="prompter-text" id="prompter-text-display">
        "I was drowning in 46,000 notes across Obsidian."
      </div>
      <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
        <button class="btn" id="btn-prev-line">⏮️ Prev Line</button>
        <button class="btn btn-primary" id="btn-speak-active">▶️ Play Voiceover</button>
        <button class="btn btn-success" id="btn-mark-recorded">✅ Mark Recorded</button>
        <button class="btn" id="btn-next-line">⏭️ Next Line</button>
      </div>
    </div>

    <!-- Checklist of Spoken Takes -->
    <h3 style="margin-bottom: 0.75rem; font-size: 1.1rem;">Recording Takes Checklist</h3>
    <div id="recording-checklist-container">
      <!-- Generated by JS -->
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    let allShots = [];
    let currentIndex = 0;
    let fontSize = 2.2;

    document.addEventListener("DOMContentLoaded", async () => {
      studio.injectHeaderAndFooter("voice_over");
      const state = await studio.loadState();
      
      allShots = [];
      (state.scenes || []).forEach(sc => {
        (sc.shots || []).forEach(sh => {
          allShots.push({ ...sh, sceneNumber: sc.number, sceneTitle: sc.title });
        });
      });

      renderChecklist();
      updatePrompter();

      document.getElementById("btn-font-larger").addEventListener("click", () => {
        fontSize = Math.min(3.5, fontSize + 0.2);
        document.getElementById("prompter-text-display").style.fontSize = `${fontSize}rem`;
      });
      document.getElementById("btn-font-smaller").addEventListener("click", () => {
        fontSize = Math.max(1.4, fontSize - 0.2);
        document.getElementById("prompter-text-display").style.fontSize = `${fontSize}rem`;
      });

      document.getElementById("btn-prev-line").addEventListener("click", () => {
        if (currentIndex > 0) { currentIndex--; updatePrompter(); renderChecklist(); }
      });
      document.getElementById("btn-next-line").addEventListener("click", () => {
        if (currentIndex < allShots.length - 1) { currentIndex++; updatePrompter(); renderChecklist(); }
      });
      document.getElementById("btn-speak-active").addEventListener("click", () => {
        if (allShots[currentIndex]) {
          studio.speakVoiceover(allShots[currentIndex].voiceover);
        }
      });
      document.getElementById("btn-mark-recorded").addEventListener("click", () => {
        if (allShots[currentIndex]) {
          allShots[currentIndex].status = "completed";
          studio.saveLocalState();
          studio.toast("Take marked as completed!", "success");
          if (currentIndex < allShots.length - 1) {
            currentIndex++;
            updatePrompter();
          }
          renderChecklist();
        }
      });
    });

    function updatePrompter() {
      if (!allShots.length) return;
      const cur = allShots[currentIndex];
      document.getElementById("prompter-scene-tag").textContent = `Scene ${cur.sceneNumber} • Shot ${cur.shotNumber}`;
      document.getElementById("prompter-text-display").textContent = `"${cur.voiceover || 'No voiceover line'}"`;
      const words = (cur.voiceover || "").split(/\s+/).filter(Boolean).length;
      document.getElementById("prompter-wpm-tag").textContent = `${words} words • ${cur.duration || 5}s`;
    }

    function renderChecklist() {
      const container = document.getElementById("recording-checklist-container");
      container.innerHTML = allShots.map((sh, idx) => `
        <div class="recording-item ${idx === currentIndex ? 'active' : ''}" onclick="jumpToShot(${idx})" style="cursor:pointer;">
          <div style="display:flex; align-items:center; gap:0.75rem;">
            <input type="checkbox" ${sh.status === 'completed' ? 'checked' : ''} onclick="event.stopPropagation(); toggleShotStatus(${idx})">
            <div>
              <strong>Scene ${sh.sceneNumber}.${sh.shotNumber}</strong>: "${sh.voiceover || ''}"
              <div style="color:var(--text-muted); font-size:0.75rem;">${sh.duration}s • ${sh.visualNotes || ''}</div>
            </div>
          </div>
          <span class="badge ${sh.status === 'completed' ? 'badge-green' : 'badge-gold'}">${sh.status}</span>
        </div>
      `).join("");
    }

    window.jumpToShot = (idx) => {
      currentIndex = idx;
      updatePrompter();
      renderChecklist();
    };

    window.toggleShotStatus = (idx) => {
      allShots[idx].status = allShots[idx].status === 'completed' ? 'in-progress' : 'completed';
      studio.saveLocalState();
      renderChecklist();
    };
  </script>
</body>
</html>
