<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shotlist Data Grid — August Video Animation #2</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .table-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin-bottom: 1.5rem;
    }
    table.data-grid {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }
    table.data-grid th {
      background: var(--bg-surface-elevated);
      color: var(--text-secondary);
      font-weight: 700;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    table.data-grid td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }
    table.data-grid tr:hover {
      background: var(--bg-surface-hover);
    }
    .grid-input {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-primary);
      width: 100%;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.25rem 0.4rem;
      border-radius: var(--radius-sm);
    }
    .grid-input:focus {
      background: var(--bg-surface-elevated);
      border-color: var(--accent-blue);
      outline: none;
    }
  </style>
</head>
<body>
  <header class="app-header"></header>

  <main class="app-container">
    <div class="view-header">
      <div class="view-title-group">
        <h1>📊 Shotlist Data Grid & Production Registry</h1>
        <p>High-density data view for rapid inline editing, duration calculation, and batch metadata tagging.</p>
      </div>
      <div class="header-actions">
        <input type="text" id="grid-filter" class="form-input" placeholder="Filter shots or tags..." style="width: 220px;">
        <button class="btn" id="btn-export-csv">📥 Export CSV</button>
        <button class="btn btn-primary" id="btn-save-grid">💾 Save All</button>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <table class="data-grid" id="main-data-grid">
        <thead>
          <tr>
            <th style="width: 70px;">ID</th>
            <th style="width: 80px;">Scene</th>
            <th style="width: 75px;">Dur (s)</th>
            <th>Voiceover Copy (Spoken Line)</th>
            <th>Visual Direction</th>
            <th style="width: 110px;">Status</th>
            <th style="width: 140px;">Tags</th>
            <th style="width: 90px;">Actions</th>
          </tr>
        </thead>
        <tbody id="grid-body">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      studio.injectHeaderAndFooter("shotlist");
      const state = await studio.loadState();
      renderGrid(state);

      document.getElementById("grid-filter").addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        renderGrid(studio.state, term);
      });

      document.getElementById("btn-save-grid").addEventListener("click", () => {
        studio.syncToCloud();
      });

      document.getElementById("btn-export-csv").addEventListener("click", () => {
        exportCSV(studio.state);
      });
    });

    function renderGrid(state, filter = "") {
      const tbody = document.getElementById("grid-body");
      let rows = [];

      state.scenes.forEach(scene => {
        (scene.shots || []).forEach(shot => {
          const searchStr = `${scene.number} ${shot.shotNumber} ${shot.voiceover} ${shot.visualNotes} ${(shot.tags || []).join(' ')}`.toLowerCase();
          if (filter && !searchStr.includes(filter)) return;

          rows.push(`
            <tr id="row-${shot.id}">
              <td style="font-family:var(--font-mono); font-size:0.75rem;">${shot.id}</td>
              <td><strong>Sc ${scene.number}</strong></td>
              <td>
                <input type="number" step="0.5" class="grid-input" value="${shot.duration || 5.0}" onchange="updateShotDuration('${shot.id}', this.value)" style="width:60px;">
              </td>
              <td>
                <input type="text" class="grid-input" value="${(shot.voiceover || '').replace(/"/g, '&quot;')}" onchange="updateGridVO('${shot.id}', this.value)">
              </td>
              <td>
                <input type="text" class="grid-input" value="${(shot.visualNotes || '').replace(/"/g, '&quot;')}" onchange="updateGridVisual('${shot.id}', this.value)">
              </td>
              <td>
                <select class="form-select btn-sm" onchange="updateGridStatus('${shot.id}', this.value)">
                  <option value="completed" ${shot.status === 'completed' ? 'selected' : ''}>Completed</option>
                  <option value="in-progress" ${shot.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                  <option value="ready" ${shot.status === 'ready' ? 'selected' : ''}>Ready</option>
                </select>
              </td>
              <td>
                <input type="text" class="grid-input" value="${(shot.tags || []).join(', ')}" onchange="updateGridTags('${shot.id}', this.value)">
              </td>
              <td>
                <button class="btn btn-sm" onclick="studio.speakVoiceover('${(shot.voiceover || '').replace(/'/g, "\\'")}')">▶️</button>
              </td>
            </tr>
          `);
        });
      });

      tbody.innerHTML = rows.join("") || `<tr><td colspan="8" style="text-align:center; padding:2rem; color:var(--text-muted);">No shots matching filter.</td></tr>`;
    }

    function findShot(shotId) {
      for (const scene of studio.state.scenes) {
        for (const shot of scene.shots) {
          if (shot.id === shotId) return shot;
        }
      }
      return null;
    }

    window.updateShotDuration = (id, val) => {
      const sh = findShot(id);
      if (sh) { sh.duration = parseFloat(val) || 5.0; studio.saveLocalState(); }
    };
    window.updateGridVO = (id, val) => {
      const sh = findShot(id);
      if (sh) { sh.voiceover = val; studio.saveLocalState(); }
    };
    window.updateGridVisual = (id, val) => {
      const sh = findShot(id);
      if (sh) { sh.visualNotes = val; studio.saveLocalState(); }
    };
    window.updateGridStatus = (id, val) => {
      const sh = findShot(id);
      if (sh) { sh.status = val; studio.saveLocalState(); }
    };
    window.updateGridTags = (id, val) => {
      const sh = findShot(id);
      if (sh) { sh.tags = val.split(",").map(t => t.trim()).filter(Boolean); studio.saveLocalState(); }
    };

    function exportCSV(state) {
      const headers = ["Shot ID", "Scene", "Shot Number", "Duration", "Voiceover", "Visual Notes", "Status", "Tags"];
      const rows = [headers];
      state.scenes.forEach(s => {
        (s.shots || []).forEach(sh => {
          rows.push([
            sh.id,
            s.number,
            sh.shotNumber,
            sh.duration,
            `"${(sh.voiceover || '').replace(/"/g, '""')}"`,
            `"${(sh.visualNotes || '').replace(/"/g, '""')}"`,
            sh.status,
            `"${(sh.tags || []).join('; ')}"`
          ]);
        });
      });
      const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "aug_shotlist_export.csv");
      document.body.appendChild(link);
      link.click();
      link.remove();
      studio.toast("Exported shotlist to CSV", "success");
    }
  </script>
</body>
</html>
