<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Asset Gallery — August Video Animation #2</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-filter-bar {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .filter-chip {
      padding: 0.35rem 0.75rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
    }
    .filter-chip:hover, .filter-chip.active {
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
    }
    .media-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all var(--transition-fast);
    }
    .media-card:hover {
      border-color: var(--accent-purple);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .media-thumb-wrap {
      width: 100%;
      height: 170px;
      background: #05070a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .media-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .media-info {
      padding: 0.85rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header class="app-header"></header>

  <main class="app-container">
    <div class="view-header">
      <div class="view-title-group">
        <h1>🖼️ Media Asset Gallery (Stills & 26 Flow Videos)</h1>
        <p>Comprehensive visual catalog of 16-stage slide stills, Canva exports, and AI-generated Google Flow video assets.</p>
      </div>
      <div class="header-actions">
        <input type="text" id="gallery-search" class="form-input" placeholder="Search captions or files..." style="width: 220px;">
      </div>
    </div>

    <!-- Filter Bar for Stages 00 to 15 + Video Flow -->
    <div class="gallery-filter-bar" id="gallery-filters">
      <button class="filter-chip active" data-filter="all">All Media</button>
      <button class="filter-chip" data-filter="video_flow">🎥 26 Flow Videos</button>
      <button class="filter-chip" data-filter="00">Stage 00: Index</button>
      <button class="filter-chip" data-filter="01">Stage 01: Architecture</button>
      <button class="filter-chip" data-filter="02">Stage 02: Plan</button>
      <button class="filter-chip" data-filter="03">Stage 03: Assets</button>
      <button class="filter-chip" data-filter="04">Stage 04: Cohort</button>
      <button class="filter-chip" data-filter="05">Stage 05: Gaps</button>
      <button class="filter-chip" data-filter="06">Stage 06: Assembly</button>
      <button class="filter-chip" data-filter="07">Stage 07: Polish</button>
      <button class="filter-chip" data-filter="08">Stage 08: Refinement</button>
      <button class="filter-chip" data-filter="09">Stage 09: Audio</button>
      <button class="filter-chip" data-filter="10">Stage 10: EditColor</button>
      <button class="filter-chip" data-filter="11">Stage 11: Thumbnail</button>
      <button class="filter-chip" data-filter="12">Stage 12: Export</button>
      <button class="filter-chip" data-filter="13">Stage 13: Metadata</button>
      <button class="filter-chip" data-filter="15">Stage 15: Tactics</button>
    </div>

    <!-- Media Grid -->
    <div class="grid-16" id="media-grid-container">
      <!-- Populated by JS -->
    </div>
  </main>

  <!-- Preview Modal -->
  <div class="modal-backdrop" id="modal-preview">
    <div class="modal-card" style="max-width: 850px;">
      <div class="card-header">
        <span class="card-title" id="prev-title">Media Preview</span>
        <button class="btn btn-sm btn-icon" id="btn-close-prev">✕</button>
      </div>
      <div style="background: #000; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 1rem; max-height: 480px; display: flex; align-items: center; justify-content: center;">
        <img id="prev-img" src="" alt="Preview" style="max-width: 100%; max-height: 480px; object-fit: contain;">
      </div>
      <div style="font-size: 0.85rem; color: var(--text-secondary);" id="prev-meta"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let allMediaItems = [];

    document.addEventListener("DOMContentLoaded", async () => {
      studio.injectHeaderAndFooter("gallery");
      await loadGallery();

      // Check URL query for stage param
      const urlParams = new URLSearchParams(window.location.search);
      const stageParam = urlParams.get("stage");
      if (stageParam) {
        applyFilter(stageParam);
      }

      document.getElementById("gallery-filters").addEventListener("click", (e) => {
        if (e.target.classList.contains("filter-chip")) {
          document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
          e.target.classList.add("active");
          applyFilter(e.target.dataset.filter);
        }
      });

      document.getElementById("gallery-search").addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        renderGallery(allMediaItems.filter(i => (i.caption || i.title || i.file).toLowerCase().includes(term)));
      });

      const modalPrev = document.getElementById("modal-preview");
      document.getElementById("btn-close-prev").addEventListener("click", () => modalPrev.classList.remove("open"));
    });

    async function loadGallery() {
      try {
        const res = await fetch("/api/manifests");
        const data = await res.json();
        allMediaItems = [];

        // Add stills
        (data.stills || []).forEach(s => {
          allMediaItems.push({
            type: "still",
            stage: s.stage,
            stageName: s.stageName,
            caption: s.caption,
            file: s.file,
            thumb: s.file
          });
        });

        // Add flow videos
        if (data.video_flow && data.video_flow.files) {
          data.video_flow.files.forEach(v => {
            allMediaItems.push({
              type: "video_flow",
              stage: "video_flow",
              stageName: "Flow Video",
              caption: `Flow Clip #${v.seq}: ${v.title}`,
              file: `video_flow/${v.to}`,
              thumb: `video_flow/${v.frame}`
            });
          });
        }

        renderGallery(allMediaItems);
      } catch(e) {
        console.error(e);
      }
    }

    function applyFilter(filter) {
      if (filter === "all") {
        renderGallery(allMediaItems);
      } else if (filter === "video_flow") {
        renderGallery(allMediaItems.filter(i => i.type === "video_flow"));
      } else {
        renderGallery(allMediaItems.filter(i => i.stage === filter));
      }
    }

    function renderGallery(items) {
      const container = document.getElementById("media-grid-container");
      container.innerHTML = items.map((item, idx) => `
        <div class="media-card">
          <div class="media-thumb-wrap" onclick="previewMedia(${idx})">
            <img src="${item.thumb}" alt="${item.caption || ''}" onerror="this.src='stills/00_index/00_index_00_framework.svg'">
          </div>
          <div class="media-info">
            <div>
              <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                <span class="badge ${item.type === 'video_flow' ? 'badge-purple' : 'badge-blue'}">${item.stageName || item.stage}</span>
              </div>
              <h5 style="font-size:0.85rem; font-weight:700; margin-bottom:4px; line-height:1.3;">${item.caption || item.title || item.file}</h5>
            </div>
            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:8px; font-family:var(--font-mono); overflow:hidden; text-overflow:ellipsis;">
              ${item.file}
            </div>
          </div>
        </div>
      `).join("") || `<div style="grid-column:1/-1; text-align:center; padding:3rem; color:var(--text-muted);">No media assets found in this filter.</div>`;
    }

    window.previewMedia = (idx) => {
      const item = allMediaItems[idx];
      if (item) {
        document.getElementById("prev-title").textContent = item.caption || item.file;
        document.getElementById("prev-img").src = item.thumb;
        document.getElementById("prev-meta").innerHTML = `
          <strong>File Path:</strong> ${item.file}<br>
          <strong>Stage:</strong> ${item.stageName || item.stage}
        `;
        document.getElementById("modal-preview").classList.add("open");
      }
    };
  </script>
</body>
</html>
